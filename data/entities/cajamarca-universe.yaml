# Universo verificado de ContractingEntity -- region Cajamarca, Fase 1.
#
# ADR 0006: este fichero ES la fuente de verdad versionada; el historial de Git es el
# "diff legible" que exige specs/001-entity-mapping/spec.md. Un paso de siembra aparte
# (scripts/seed_contracting_entities.py) lo carga a la tabla `contracting_entities` de
# PostgreSQL -- ese script debe fallar ruidosamente si el fichero y la tabla divergen.
#
# Alcance de esta ronda (specs/001-entity-mapping/plan.md, "Orden de implementacion",
# pasos 1-3): SOLO el Gobierno Regional de Cajamarca y las 13 municipalidades
# provinciales -- el subconjunto que RN-001-01 fija como obligatorio sin excepcion.
# Ninguna municipalidad distrital entra aqui: eso es AC-001-01, bloqueado (paso 4, no
# implementado). Ninguna unidad ejecutora del Gobierno Regional entra como entidad
# propia: eso es AC-001-03, bloqueado (paso 5, no implementado).
#
# Verificacion cruzada de RUC (RN-001-03), honesta sobre sus limites:
#
# - Fuente 1: agregadores que republican el padron publico de RUC de SUNAT
#   (datosperu.org, ruc.pe). No son SUNAT directamente -- el portal oficial
#   e-consultaruc.sunat.gob.pe exige resolver un captcha por consulta interactiva, y
#   esta sesion no tuvo forma de automatizar eso sin saltarselo (la regla de
#   "prohibido bypasear CAPTCHAs" del propio agente lo impide). Se documenta como lo
#   que es: un espejo de tercero, no la fuente primaria.
# - Fuente 2: el Portal de Transparencia Estandar de la Contraloria General de la
#   Republica (apps.contraloria.gob.pe/ciudadano/wfm_rpt_PteEntidad.aspx?RUC=<ruc>) --
#   ESTA si es una fuente oficial del Estado peruano, independiente de la fuente 1.
#   Dado un RUC, devuelve departamento/provincia/distrito (y, cuando la entidad tiene
#   obras registradas en InfoObras, tambien el nombre oficial) -- se uso para confirmar
#   que el RUC de la fuente 1 corresponde de verdad a la entidad de Cajamarca esperada
#   y no a una entidad homonima de otra region.
# - Las 14 entidades de este fichero tienen las dos fuentes coincidiendo en
#   departamento=CAJAMARCA y en la provincia/distrito esperados. Ninguna quedo con
#   verificacion parcial (CL-001-03 no aplica a esta ronda).
#
# `consucode_id` (identificador OECE, `scheme: PE-CONSUCODE`): NO se pudo verificar
# para ninguna de las 14 entidades en esta sesion. `GET /api/v1/releases` y
# `GET /api/v1/records` de la API OCDS de OECE son una ventana rotativa de ~20
# publicaciones a nivel NACIONAL, sin parametro de filtro server-side que funcione
# (confirmado en docs/research/2026-08-20-verificacion-tecnica-fuentes.md, S1.2) ni
# busqueda por entidad. Se hicieron ~15 muestreos el 2026-08-20 (ver
# scripts/verification/probe-oece-ocds.sh) y ninguno capturo a alguna de las 14
# entidades de este universo como buyer/procuringEntity -- si aparece, es
# coincidencia de que su proceso este entre las ~20 publicaciones mas recientes del
# pais en el momento exacto de la consulta. `consucode_id` queda `null` para las 14,
# con nota de verificacion pendiente por entidad (ver `consucode_verification_note`).
# `002-seace-ingestion`, cuando corra de forma continua contra el feed, ira
# completando este campo de forma organica conforme cada entidad aparezca como buyer
# real -- no es una tarea manual de esta ronda.
#
# Cruce fiscal actualizado 2026-10-14: las 13 municipales provinciales usan sus
# `SEC_EJEC` MEF oficiales. No se asigna significado municipal a un rango entero:
# 300605, por ejemplo, es la ejecutora provincial de Cutervo. Los códigos SEC_EJEC/UBIGEO
# verificados se guardan bajo verification
# para no ampliar el contrato canonico ContractingEntity (ADR 0006).

