name: Harvester Cloud Worker - Ingesta y Monitoreo Continuo

on:
  schedule:
    # Ejecuta cada 2 horas (a minuto 0) de forma completamente autonoma
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Fuentes a cosechar separadas por coma"
        required: false
        default: "seace,mef"
      evaluate_geospatial:
        description: "Evaluar teledeteccion satelital geoespacial (Sentinel-1/2)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: harvester-worker
  cancel-in-progress: false

jobs:
  harvest-and-monitor:
    name: Cosecha Continua SEACE/MEF y Teledeteccion Satelital
    runs-on: ubuntu-latest
    environment:
      name: "Production \u2013 cajamarca-qhaway"
    timeout-minutes: 25
    env:
      SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias con soporte relacional
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db]"

      - name: Verificar destino PostgreSQL sin revelar la credencial
        env:
          CAJAMARCA_QHAWAY_DATABASE_URL: ${{ secrets.CAJAMARCA_QHAWAY_DATABASE_URL }}
        run: python scripts/check-worker-connection.py

      - name: Ejecutar cosecha en vivo (SEACE OCDS y MEF DataStore)
        env:
          CAJAMARCA_QHAWAY_DATABASE_URL: ${{ secrets.CAJAMARCA_QHAWAY_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HARVEST_SOURCES: ${{ inputs.sources || 'seace,mef' }}
        run: |
          echo "Iniciando ciclo de recoleccion continua..."
          python -m cajamarca_qhaway.cli harvest run --source "$HARVEST_SOURCES" --once

      - name: Mostrar evidencia de fuentes fallidas
        if: ${{ failure() }}
        run: python -m cajamarca_qhaway.cli harvest gaps --limit 10

      - name: Comprobar cobertura del catalogo geoespacial
        id: geo_catalog
        if: ${{ inputs.evaluate_geospatial != false }}
        run: |
          python - <<'PY'
          import os
          from cajamarca_qhaway.capabilities.geospatial_monitoring import CAJAMARCA_PUBLIC_WORKS_CATALOG
          count = len(CAJAMARCA_PUBLIC_WORKS_CATALOG)
          print(f"Obras verificadas disponibles: {count}")
          if not count:
              print("Evaluacion satelital SIN COBERTURA: catalogo verificado vacio.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_works={str(bool(count)).lower()}\n")
          PY

      - name: Ejecutar evaluacion geoespacial satelital multi-temporal
        if: ${{ inputs.evaluate_geospatial != false && steps.geo_catalog.outputs.has_works == 'true' }}
        env:
          CAJAMARCA_QHAWAY_DATABASE_URL: ${{ secrets.CAJAMARCA_QHAWAY_DATABASE_URL }}
        run: |
          echo "Evaluando divergencia fisico-financiera con radar SAR y optico..."
          python -m cajamarca_qhaway.cli geospatial evaluate --sar

      - name: Verificar estado y consistencia de la base de datos
        env:
          CAJAMARCA_QHAWAY_DATABASE_URL: ${{ secrets.CAJAMARCA_QHAWAY_DATABASE_URL }}
        run: |
          python -m cajamarca_qhaway.cli db status
          python -m cajamarca_qhaway.cli harvest status
          python - <<'PY'
          from cajamarca_qhaway.persistence.sync import SyncManager
          status = SyncManager().status()
          if not status["is_postgres"] or status["pending_spool_files"]:
              raise SystemExit("Persistencia PostgreSQL no confirmada o spool pendiente")
          PY
