name: CI - Cajamarca Qhaway (Pilares 1, 2 y 3)

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-audit:
    name: Pytest Suite & Web Integrity Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic test suite (Pilares 1, 2 y 3)
        run: |
          pytest -v

      - name: Audit Web Platform & Constitutional Invariants
        run: |
          python -m cajamarca_qhaway.cli web audit
