name: CI - Cajamarca Qhaway (Pilares 1, 2 y 3)

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-audit:
    name: Pytest Suite & Web Integrity Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --extra dev --extra db --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run deterministic test suite (Pilares 1, 2 y 3)
        run: |
          python scripts/deterministic-engine/generate-deterministic-contracts.py --check
          python -m coverage run --branch --source=cajamarca_qhaway.capabilities.deterministic_engine -m pytest -v
          python -m coverage report --fail-under=90
          python -m coverage json -o coverage-engine.json
          python scripts/deterministic-engine/check-deterministic-coverage.py coverage-engine.json

      - name: Kill deterministic semantic mutants
        run: python scripts/deterministic-engine/mutate-deterministic-engine.py --output engine-mutations.json

      - name: Audit Web Platform & Constitutional Invariants
        run: |
          python -m cajamarca_qhaway.cli web audit

      - name: Verify pre-rendered HTML metrics against verified snapshot
        run: python scripts/audit_snapshot_parity.py

      - name: Verify fiscal period after client hydration
        run: node --test tests/*.test.mjs

      - name: Run static accessibility and contrast checks
        run: python scripts/audit_accessibility_static.py

      - name: Enforce prohibited Unicode dash policy
        run: python scripts/audit_antislop.py
